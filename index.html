<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Finding Peace</title>
    <style>
      /* Mọi khung, nút, biểu tượng đều là tranh gouache trong public/assets/ui. CSS chỉ đặt vị trí và chữ. */
      html, body { margin: 0; height: 100%; background: #efe6d4; overflow: hidden; touch-action: none; }
      #stage { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
      #game { position: relative; aspect-ratio: 16 / 9; width: min(100vw, 100vh * 16 / 9); container-type: inline-size; }
      #game canvas { display: block; }
      #ui { position: absolute; inset: 0; pointer-events: none; font-family: "Lora", "Times New Roman", serif; color: #4a3626; }
      #ui img { display: block; }

      /* Lời thoại là độc thoại của nhân vật: chỉ có chữ trắng ở dưới màn hình, không có khung. */
      #ui .dialogue {
        position: absolute; left: 50%; bottom: 5%; width: 76%; transform: translate(-50%, 6px);
        text-align: center; color: #fff; font-size: 2.5cqw; line-height: 1.45; letter-spacing: .01em;
        text-shadow: 0 0 .5cqw rgba(0, 0, 0, .9), 0 0 1.4cqw rgba(0, 0, 0, .75), 0 .2cqw .4cqw rgba(0, 0, 0, .9);
        pointer-events: none; opacity: 0; transition: opacity .35s, transform .35s; z-index: 10;
      }
      #ui .dialogue.show { opacity: 1; transform: translate(-50%, 0); }

      #ui .clock { position: absolute; top: 3%; left: 2.5%; width: 7.5%; z-index: 6; }

      /* Cảnh riêng (chuỗi tranh) phủ lên canvas; lời thoại luôn nằm trên cùng. */
      #ui .cutscene { position: absolute; inset: 0; z-index: 5; }
      #ui .cut-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ui .cut-black { position: absolute; inset: 0; background: #000; }

      #ui .setup-start {
        border: 0; padding: 0; background: url(assets/ui/button.webp) center / 100% 100% no-repeat;
        aspect-ratio: 360 / 155; color: #4a3626; font: inherit; cursor: pointer; pointer-events: auto;
      }

      #ui .setup { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2cqw; }
      #ui .setup-title {
        width: 50%; aspect-ratio: 1280 / 236; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
        background: url(assets/ui/dialogue.webp) center / 100% 100% no-repeat; font-size: 2.5cqw;
      }
      #ui .setup-body { display: flex; align-items: center; gap: 5cqw; }
      #ui .setup-col { display: flex; flex-direction: column; align-items: center; gap: 1.2cqw; }
      #ui .setup-label { font-size: 2cqw; opacity: .8; }
      #ui .setup-row { display: flex; gap: 2.4cqw; align-items: flex-end; }
      #ui .card { position: relative; display: flex; flex-direction: column; align-items: center; gap: .6cqw; cursor: pointer; pointer-events: auto; opacity: .72; transition: opacity .2s, transform .2s; }
      #ui .card.selected { opacity: 1; transform: translateY(-.6cqw); }
      #ui .card.selected::after {
        content: ""; position: absolute; top: -6%; right: -14%; width: 38%; aspect-ratio: 200 / 162;
        background: url(assets/ui/ornament.webp) center / 100% 100% no-repeat;
      }
      #ui .card-char { width: 8.5cqw; }
      #ui .char-face { width: 100%; background-repeat: no-repeat; background-position: 0 0; }
      #ui .card-apt { width: 18cqw; }
      #ui .card-apt img { width: 100%; }
      #ui .card-name { font-size: 1.7cqw; text-align: center; }
      #ui .setup-start { width: 15cqw; font-size: 2.2cqw; }

      @media (prefers-reduced-motion: reduce) { #ui * { transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="game"><div id="ui"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
